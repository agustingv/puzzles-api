framework:
    rate_limiter:
        # Wrong secrets from one IP address: past this, its writes are refused for a while (see
        # App\Security\SecretGuessLimiter). The app never sends a wrong secret, so only someone
        # guessing reaches it.
        secret_guess:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
            lock_factory: null
