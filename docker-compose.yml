services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./app:/var/www/html:cached
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "9000"

  nginx:
    image: nginx:alpine
    depends_on:
      - php
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: puzzles
      MYSQL_USER: puzzles
      # Development values: production sets its own through the environment, never in git.
      MYSQL_PASSWORD: puzzles
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - database:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database:
